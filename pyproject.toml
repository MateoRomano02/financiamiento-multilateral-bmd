[project]
name = "financiamiento-multilateral-bmd"
version = "0.1.0"
description = "Bases armonizadas de proyectos aprobados por bancos multilaterales de desarrollo (GBM, GBID, CAF, NDB, AIIB)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",   # lectura/escritura de Excel
    "httpx>=0.27",     # cliente HTTP para APIs y descargas
    "pyyaml>=6.0",     # configuracion de fuentes por banco
    "pypdf>=6.19.0",
    "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
